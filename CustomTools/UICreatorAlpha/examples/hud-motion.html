<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HUD 动效预览</title>
<style>:root{color-scheme:dark;font:14px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;color:#d5e0ed;background:#10151c}*{box-sizing:border-box}body{margin:0}header{display:flex;align-items:center;gap:24px;padding:20px 28px;border-bottom:1px solid #33414d;background:#19212c}header a{margin-left:auto;color:#9dd6bb}label{display:flex;align-items:center;gap:8px;cursor:pointer}input{accent-color:#85d3b1}main{max-width:1120px;margin:70px auto;padding:0 32px}h1{font-size:27px;font-weight:500;margin:0 0 10px}p{color:#8fa4b7}#stage{border:1px solid #395247;border-radius:12px;background:#090c12;margin:30px 0;padding:24px 0;overflow:visible}svg{display:block;width:100%;height:auto;overflow:visible}.notes{display:flex;gap:16px;flex-wrap:wrap}.notes span{padding:10px 15px;border:1px solid #2d3b47;background:#18212c;border-radius:7px;color:#a7c7b7}#status{min-height:30px;color:#b4d7c4}.hint{font-size:12px}</style>
<header><b>HUD · 动效与音效</b><label><input type="checkbox" id="motion" checked>播放动效</label><button id="sound-toggle" aria-pressed="false">♪ 开启音效</button><a href="/?project=hud-darksteel-20261024">返回 UICreator</a></header>
<main><h1>鼠标经过，就有回应。</h1><p>移到技能槽上看轻微抬起；按下再释放看回弹。按 1–4 切换选中槽，观察独立辉光呼吸。</p><div id="stage"><svg id="hud" aria-label="快捷栏动效预览"></svg></div><div class="notes"><span>悬停 · 160 ms</span><span>按压 · 70 ms</span><span>释放回弹 · 240 ms</span><span>选中呼吸 · 1.9 s</span></div><p id="status" role="status">读取 SVG 资产…</p><p class="hint">视觉层运动，布局和点击区域保持固定。系统开启“减少动态效果”时自动停用动画。</p></main>
<style>#hud [role=button]:focus{outline:none}#hud [role=button]:focus-visible{outline:1px solid #739c8a;outline-offset:1px}#sound-toggle{padding:6px 12px;border:1px solid #537b69;border-radius:5px;background:#243a31;color:#b8e3cb;cursor:pointer}#sound-status{font-size:12px;color:#9fc7b3;min-height:22px}</style>
