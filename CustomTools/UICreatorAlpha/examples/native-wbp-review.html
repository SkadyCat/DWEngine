<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>SVG → WBP 验证</title>
<style>body{margin:0;background:#10161e;color:#d5e0ed;font:14px/1.6 'Segoe UI','Microsoft YaHei',sans-serif}header{padding:22px 30px;background:#19232f;display:flex;align-items:center;gap:24px}select,a{color:#9de0bc}select{background:#202e3b;padding:8px;border:1px solid #466273}main{padding:24px 30px}#status{white-space:pre-wrap;margin-bottom:22px}.captures{display:grid;grid-template-columns:1fr 1fr;gap:18px}figure{margin:0}figure img{width:100%;display:block;border:1px solid #384957;background:repeating-conic-gradient(#1b2530 0 25%,#283441 0 50%) 0/16px 16px}figcaption{padding:8px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px}.asset{padding:12px;background:#1c2835;overflow:hidden}.asset img{height:80px;width:100%;object-fit:contain}.asset small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.diff{width:100%;margin:16px 0}h2{font-size:16px;margin-top:28px}code{color:#9de0bc}.failed{color:#ffd09a}.passed{color:#9de0bc}</style>
<header><b>SVG → PNG → WBP</b><select id="state" aria-label="界面状态"></select><a id="export">重新查看导入包</a><a href="/?project=hud-darksteel-20261024">UICreator</a></header>
<main><div id="status">读取验证结果…</div><div class="captures"><figure><img id="reference" alt="冻结网页画布"><figcaption>冻结网页画布</figcaption></figure><figure><img id="native" alt="UE 原生 WBP 渲染"><figcaption>UE 原生 WBP 渲染</figcaption></figure></div><details><summary>像素差异图（红色表示有差异）</summary><img class="diff" id="diff" alt="像素差异图"></details><h2>透明 PNG 控件资产</h2><div class="gallery" id="gallery"></div></main>
<script type="module">
const job = new URLSearchParams(location.search).get('job') || 'wbp-hud-native-20261025', base=`/exports/${job}`, $=s=>document.querySelector(s);
const bundle=await fetch(`${base}/bundle.json`).then(r=>r.json());
let report=null, reload=null;
try { report=await fetch(`${base}/pixel-report.json`).then(r=>r.ok?r.json():null); reload=await fetch(`${base}/native/reload-receipt.json`).then(r=>r.ok?r.json():null); } catch {}
$('#export').href=`/examples/native-wbp-export.html?job=${job}`;
for(const state of [...Object.keys(bundle.states), ...(reload?.savedDesignerDefaultsRendered ? ['designer'] : [])]){const o=document.createElement('option');o.value=state;o.textContent=state;$('#state').append(o);}
function show(){const state=$('#state').value, row=report?.states.find(s=>s.state===state);$('#reference').src=`${base}/reference/${state === 'designer' ? 'canvas' : state}.png`;$('#native').src=`${base}/native/${state}.png`;$('#diff').src=`${base}/native/${state}-diff.png`;
$('#status').className=row?.exact?'passed':'failed';$('#status').textContent=`${bundle.viewport.width} × ${bundle.viewport.height} · ${bundle.nodes.length} 个层级节点 · ${Object.keys(bundle.project.assets).length} 个源 SVG · ${Object.keys(bundle.rasters).length} 张 PNG 缓存\n${reload?.hierarchyMatches?'保存后重新加载：层级一致':'保存后重新加载：尚未验证'}\n${row?`严格像素验收：${row.exact?'通过':'未通过'} · 差异像素 ${row.changedPixels.toLocaleString()} · 最大通道差 ${row.maxChannelError}`:'严格像素验收：尚未运行'}`;
$('#gallery').replaceChildren();const names=new Map(bundle.nodes.map(n=>[n.id,n.name||n.type])); const seen=new Set();for(const node of bundle.states[state === 'designer' ? 'canvas' : state].nodes){if(!node.raster||seen.has(node.raster)||!node.parentId)continue;seen.add(node.raster);const a=document.createElement('a');a.className='asset';a.href=`${base}/rasters/${node.raster}.png`;a.target='_blank';const img=document.createElement('img');img.src=a.href;img.alt=names.get(node.id);const label=document.createElement('small');label.textContent=names.get(node.id);a.append(img,label);$('#gallery').append(a);}}
$('#state').onchange=show;show();
</script></html>
